experiment:
  name: paper_clean_no_osm_160_fold0_20260715
  seed: 42
  output_dir: /data/xuannv_embedding/outputs/paper_20260715/paper_clean_no_osm_160_fold0_20260715
  use_wandb: true
  wandb_project: xuannv-embedding-v2
  wandb_run_name: paper_clean_no_osm_160_fold0_20260715
model:
  embed_dim: 64
  stem_dim: 32
  num_months: 6
  ref_year: 2025
  ref_month: 12
  stp:
    space_dim: 512
    time_dim: 256
    precision_dim: 128
    precision_scale: 1
    num_blocks: 6
    num_heads: 8
    temporal_fusion: gated_sum
    time_attention_mode: full
    highres_fusion_to_embedding: true
  sensor_channels:
    s2: 12
    s1: 2
    landsat: 7
    highres_optical_haidian: 3
    highres_sar_haidian: 1
  target_heads:
    s2_recon:
      source: s2
      loss_type: continuous
      channels: 12
      weight: 0.8
    s1_recon:
      source: s1
      loss_type: continuous
      channels: 2
      weight: 0.25
    landsat_recon:
      source: landsat
      loss_type: continuous
      channels: 7
      weight: 0.45
    highres_optical_haidian_recon:
      source: highres_optical_haidian
      loss_type: continuous
      channels: 3
      weight: 0.9
    highres_sar_haidian_recon:
      source: highres_sar_haidian
      loss_type: continuous
      channels: 1
      weight: 0.35
training:
  epochs: 800
  lr: 2.0e-06
  weight_decay: 0.05
  warmup_epochs: 30
  gradient_accumulation_steps: 6
  save_every: 200
  eval_every: 20
  amp: true
  gradient_checkpointing: true
  log_every: 50
  uniformity_weight: 0.06
  uniformity_warmup_epochs: 60
  uniformity_temperature: 2.0
  temporal_endpoint_weight: 0.0
  temporal_endpoint_warmup_epochs: 0
  temporal_endpoint_margin: 0.15
  temporal_contrast_weight: 0.0
  temporal_contrast_warmup_epochs: 0
  temporal_contrast_margin: 0.2
  temporal_contrast_change_z: 0.75
  temporal_contrast_stable_z: -0.25
  temporal_contrast_sources:
  - s2_recon
  - s1_recon
  - landsat_recon
  supervised_change_weight: 0.0
  supervised_change_warmup_epochs: 0
  supervised_change_pos_margin: 0.35
  supervised_change_neg_margin: 0.05
  supervised_change_tasks: []
  supervised_change_pos_weight: 1.0
  supervised_change_neg_weight: 1.0
  supervised_change_hard_negative_ratio: 0.0
  supervised_change_task_weights: {}
  semantic_probe_weight: 0.0
  semantic_probe_warmup_epochs: 80
  semantic_probe_tasks: []
  semantic_probe_task_weights: {}
  semantic_probe_pos_weight: 2.0
  semantic_probe_pos_weights: {}
  semantic_probe_hidden_dim: 0
  semantic_probe_hard_negative_ratio: 0.0
  semantic_probe_hard_negative_weight: 0.0
  semantic_probe_hard_negative_warmup_epochs: 120
  input_masking:
    enabled: true
    drop_availability_masks: false
    modality_dropout_probs:
      s2: 0.18
      s1: 0.35
      landsat: 0.35
    month_dropout_prob: 0.65
    max_months_per_sample: 4
    spatial_block_prob: 0.65
    spatial_block_size: 16
    spatial_block_ratio: 0.32
data:
  root: /data/xuannv_embedding/processed/haidian
  region: haidian
  manifest_path: /data/xuannv_embedding/processed/haidian/paper_20260715/train_160_fold0_seed42.json
  train_manifest_path: /data/xuannv_embedding/processed/haidian/paper_20260715/train_160_fold0_seed42.json
  val_manifest_path: /data/xuannv_embedding/processed/haidian/paper_20260715/val_fold0.json
  statistics_dir: /data/xuannv_embedding/statistics/haidian
  statistics_dirs_by_region: {}
  supervised_label_roots: {}
  num_samples: 160
  max_patches: null
  batch_size: 3
  num_workers: 8
  patch_size: 128
  num_months: 6
  months:
  - 2025-12
  - 2026-01
  - 2026-02
  - 2026-03
  - 2026-04
  - 2026-05
  sources:
  - s2
  - s1
  - landsat
  - highres_optical_haidian
  - highres_sar_haidian
  source_dropout_probs: {}
  supervised_sampling:
    enabled: false
